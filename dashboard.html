<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event Ticketing Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  color:#222;
}

.card{
  background:white;
  padding:20px;
  margin:20px 0;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  background:#007bff;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:8px;
}

button:hover{
  opacity:0.9;
}

.logout{
  background:#dc3545;
}

.checkin{
  background:#28a745;
}

#dashboard{
  display:none;
}

#loginMessage,
#checkinMessage{
  text-align:center;
  margin-top:10px;
  font-weight:bold;
}

.booking{
  border:1px solid #ddd;
  padding:15px;
  margin:12px 0;
  border-radius:8px;
  background:#fafafa;
}

.booking h3{
  margin-top:0;
}

.checked{
  color:green;
  font-weight:bold;
}

.notchecked{
  color:#d9534f;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">

<h1>Admin Login</h1>

<input
  type="text"
  id="username"
  placeholder="Username"
>

<input
  type="password"
  id="password"
  placeholder="Password"
>

<button onclick="login()">Login</button>

<p id="loginMessage"></p>

</div>


<!-- DASHBOARD -->
<div id="dashboard">

<h1>Event Ticketing Dashboard</h1>

<!-- CHECK IN -->
<div class="card">

<h2>🎟️ Ticket Check-in</h2>

<p>Enter the customer's Ticket Number below.</p>

<input
  type="text"
  id="ticketNumber"
  placeholder="Enter Ticket Number"
>

<button class="checkin" onclick="checkInTicket()">
  Check In
</button>

<p id="checkinMessage"></p>

</div>


<!-- BOOKINGS -->
<div class="card">

<h2>📋 All Bookings</h2>

<div id="bookings">
  Loading bookings...
</div>

</div>


<button class="logout" onclick="logout()">
  Logout
</button>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  query,
  where,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey: "AIzaSyC-T2k0YrJOfQb7LV5qcUsOPwvWI_edXKM",

  authDomain: "event-booking-app-ee02b.firebaseapp.com",

  projectId: "event-booking-app-ee02b",

  storageBucket: "event-booking-app-ee02b.firebasestorage.app",

  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

  appId: "YOUR_APP_ID"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* LOGIN */

window.login = function(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value.trim();

  const message =
    document.getElementById("loginMessage");


  if(
    username === "Rabilupau" &&
    password === "Rabilu@123"
  ){

    document.getElementById("loginBox").style.display="none";

    document.getElementById("dashboard").style.display="block";

    loadBookings();

  }else{

    message.style.color="red";

    message.textContent="Incorrect username or password.";

  }

};


/* LOGOUT */

window.logout = function(){

  document.getElementById("dashboard").style.display="none";

  document.getElementById("loginBox").style.display="block";

  document.getElementById("username").value="";

  document.getElementById("password").value="";

};


/* LOAD BOOKINGS */

async function loadBookings(){

  const bookingsDiv =
    document.getElementById("bookings");

  bookingsDiv.innerHTML="Loading bookings...";

  try{

    const snapshot =
      await getDocs(collection(db,"bookings"));

    bookingsDiv.innerHTML="";

    if(snapshot.empty){

      bookingsDiv.innerHTML=
        "<p>No bookings found.</p>";

      return;
    }


    snapshot.forEach((bookingDoc)=>{

      const data = bookingDoc.data();

      const ticketNumber =
        data.ticketNumber ||
        data.ticket ||
        bookingDoc.id;

      const checkedIn =
        data.checkedIn === true;


      const div =
        document.createElement("div");

      div.className="booking";


      div.innerHTML=`

        <h3>🎟️ Ticket: ${ticketNumber}</h3>

        <p>
          <strong>Name:</strong>
          ${data.name || "N/A"}
        </p>

        <p>
          <strong>Email:</strong>
          ${data.email || "N/A"}
        </p>

        <p>
          <strong>Event:</strong>
          ${data.event || "N/A"}
        </p>

        <p>
          Status:
          ${
            checkedIn
            ? '<span class="checked">✅ Checked In</span>'
            : '<span class="notchecked">❌ Not Checked In</span>'
          }
        </p>

      `;

      bookingsDiv.appendChild(div);

    });

  }catch(error){

    console.error(error);

    bookingsDiv.innerHTML=
      "<p>Unable to load bookings.</p>";

  }

}


/* CHECK IN */

window.checkInTicket = async function(){

  const ticketInput =
    document.getElementById("ticketNumber");

  const message =
    document.getElementById("checkinMessage");

  const ticketNumber =
    ticketInput.value.trim();


  if(!ticketNumber){

    message.style.color="red";

    message.textContent=
      "Please enter a Ticket Number.";

    return;
  }


  message.style.color="black";

  message.textContent="Checking...";


  try{

    /*
      First search using ticketNumber
    */

    const q =
      query(
        collection(db,"bookings"),
        where("ticketNumber","==",ticketNumber)
      );


    const snapshot =
      await getDocs(q);


    if(snapshot.empty){

      /*
        If ticketNumber field does not exist,
        try using document ID.
      */

      const bookingRef =
        doc(db,"bookings",ticketNumber);

      const bookingSnap =
        await getDoc(bookingRef);


      if(!bookingSnap.exists()){

        message.style.color="red";

        message.textContent=
          "❌ Ticket not found.";

        return;

      }


      const data =
        bookingSnap.data();


      if(data.checkedIn === true){

        message.style.color="orange";

        message.textContent=
          "⚠️ This ticket has already been checked in.";

        return;

      }


      await updateDoc(
        bookingRef,
        {
          checkedIn:true,
          checkedInAt:new Date()
        }
      );


      message.style.color="green";

      message.textContent=
        "✅ Check-in successful!";


      ticketInput.value="";

      loadBookings();

      return;

    }


    /*
      Ticket found by ticketNumber
    */

    const bookingDoc =
      snapshot.docs[0];

    const data =
      bookingDoc.data();


    if(data.checkedIn === true){

      message.style.color="orange";

      message.textContent=
        "⚠️ This ticket has already been checked in.";

      return;

    }


    await updateDoc(
      doc(db,"bookings",bookingDoc.id),
      {
        checkedIn:true,
        checkedInAt:new Date()
      }
    );


    message.style.color="green";

    message.textContent=
      "✅ Check-in successful!";


    ticketInput.value="";

    loadBookings();


  }catch(error){

    console.error(error);

    message.style.color="red";

    message.textContent=
      "❌ Check-in failed. Please try again.";

  }

};

</script>

</body>
</html>
