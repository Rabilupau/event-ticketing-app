<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Event Ticketing Admin Dashboard</title><style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:15px;
  color:#222;
}

.container{
  max-width:900px;
  margin:auto;
}

h1{
  text-align:center;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:white;
  padding:18px 10px;
  text-align:center;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.stat h2{
  margin:5px 0;
  font-size:28px;
}

.stat p{
  margin:0;
  font-size:14px;
}

input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:0;
  border-radius:7px;
  background:#007bff;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.green{
  background:#28a745;
}

.red{
  background:#dc3545;
}

.orange{
  background:#f39c12;
}

.dark{
  background:#343a40;
}

#dashboard{
  display:none;
}

#loginMessage,
#checkinMessage{
  text-align:center;
  font-weight:bold;
}

/* EVENT STATISTICS */

.event-card{
  background:#fafafa;
  border:1px solid #ddd;
  padding:15px;
  margin:12px 0;
  border-radius:9px;
}

.event-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.event-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.event-names{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #ddd;
}

.event-names-title{
  font-weight:bold;
  margin-bottom:8px;
}

.event-names ul{
  margin:5px 0;
  padding-left:25px;
}

.event-names li{
  margin:6px 0;
}

/* BOOKINGS */

.booking{
  background:#fafafa;
  border:1px solid #ddd;
  padding:15px;
  margin:12px 0;
  border-radius:9px;
}

.booking h3{
  margin-top:0;
}

.status{
  font-weight:bold;
}

.checked{
  color:green;
}

.notchecked{
  color:#d9534f;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.actions button{
  margin-top:0;
}

.loading{
  text-align:center;
  padding:15px;
}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }

}

</style></head><body><div class="container"><!-- LOGIN --><div id="loginBox" class="card"><h1>🔐 Admin Login</h1><input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button type="button" onclick="login()">
Login
</button><p id="loginMessage"></p></div><!-- DASHBOARD --><div id="dashboard"><h1>🎟️ Event Admin Dashboard</h1><!-- STATISTICS --><div class="stats"><div class="stat">
<h2 id="totalBookings">0</h2>
<p>📊 Total Bookings</p>
</div><div class="stat">
<h2 id="checkedInCount">0</h2>
<p>✅ Checked In</p>
</div><div class="stat">
<h2 id="notCheckedCount">0</h2>
<p>⏳ Not Checked In</p>
</div></div><!-- EVENT STATISTICS --><div class="card"><h2>🎪 Event Statistics</h2><div id="eventStats"><div class="loading">
Loading event statistics...
</div></div></div><!-- CHECK IN --><div class="card"><h2>🎫 Ticket Check-in</h2><p>Enter Ticket Number:</p><input
type="text"
id="ticketNumber"
placeholder="Enter Ticket Number">

<button
class="green"
onclick="checkInTicket()">

✅ Check In

</button><div id="checkinResult"></div><p id="checkinMessage"></p></div><!-- SEARCH --><div class="card"><h2>🔍 Search Bookings</h2><input
type="text"
id="searchInput"
placeholder="Search by name, email, event or ticket number"
oninput="searchBookings()">

<div class="actions"><button
class="dark"
onclick="loadBookings()">

🔄 Refresh

</button><button
class="green"
onclick="exportCSV()">

📥 Export CSV

</button></div></div><!-- BOOKINGS --><div class="card"><h2>📋 All Bookings</h2><div id="bookings">Loading bookings...

</div></div><!-- LOGOUT --><button
class="red"
onclick="logout()">

🚪 Logout

</button></div></div><script type="module">

/* FIREBASE */

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyC-T2k0YrJOfQb7LV5qcUsOPwvWI_edXKM",

authDomain:
"event-booking-app-ee02b.firebaseapp.com",

projectId:
"event-booking-app-ee02b",

storageBucket:
"event-booking-app-ee02b.firebasestorage.app",

messagingSenderId:
"526513199259",

appId:
"1:526513199259:web:92442ef0079e07a0364e3e",

measurementId:
"G-QXSZ66ZFRR"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


let allBookings = [];


/* LOGIN */

window.login = function(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

const message =
document.getElementById("loginMessage");


if(
username === "Rabilupau" &&
password === "Rabilu@123"
){

document.getElementById(
"loginBox"
).style.display="none";

document.getElementById(
"dashboard"
).style.display="block";

message.textContent="";

loadBookings();

}else{

message.style.color="red";

message.textContent=
"❌ Incorrect username or password.";

}

};


/* LOGOUT */

window.logout = function(){

document.getElementById(
"dashboard"
).style.display="none";

document.getElementById(
"loginBox"
).style.display="block";

document.getElementById(
"username"
).value="";

document.getElementById(
"password"
).value="";

};


/* LOAD BOOKINGS */

window.loadBookings = async function(){

const bookingsDiv =
document.getElementById("bookings");

bookingsDiv.innerHTML=
"Loading bookings...";


try{

const snapshot =
await getDocs(
collection(db,"bookings")
);


allBookings=[];


snapshot.forEach(
(bookingDoc)=>{

allBookings.push({

id:bookingDoc.id,

...bookingDoc.data()

});

});


updateStatistics();

updateEventStatistics();

displayBookings(
allBookings
);


}catch(error){

console.error(error);

bookingsDiv.innerHTML=
"❌ Unable to load bookings.";

}

};


/* GENERAL STATISTICS */

function updateStatistics(){

const total =
allBookings.length;


const checked =
allBookings.filter(
b => b.checkedIn === true
).length;


const notChecked =
total - checked;


document.getElementById(
"totalBookings"
).textContent=total;


document.getElementById(
"checkedInCount"
).textContent=checked;


document.getElementById(
"notCheckedCount"
).textContent=notChecked;

}


/* EVENT STATISTICS */

function updateEventStatistics(){

const eventStats =
document.getElementById("eventStats");

const events = {};


allBookings.forEach(
(data)=>{

const eventName =
data.event || "Other";


if(!events[eventName]){

events[eventName] = {

total:0,

checked:0,

notChecked:0,

names:[]

};

}


events[eventName].total++;


if(data.checkedIn === true){

events[eventName].checked++;

}else{

events[eventName].notChecked++;

}


if(
data.name &&
String(data.name).trim() !== ""
){

events[eventName].names.push(
data.name
);

}

});


const eventNames =
Object.keys(events);


if(eventNames.length === 0){

eventStats.innerHTML=
"<p>No event bookings yet.</p>";

return;

}


eventNames.sort();


eventStats.innerHTML="";


eventNames.forEach(
(eventName)=>{

const event =
events[eventName];


const card =
document.createElement("div");


card.className="event-card";


let namesHTML="";


if(event.names.length > 0){

namesHTML =
event.names.map(
(name)=>{

return `
<li>
${escapeHTML(name)}
</li>
`;

}
).join("");

}else{

namesHTML=
"<li>No names available</li>";

}


card.innerHTML=`

<div class="event-title">

🎪 ${escapeHTML(eventName)}

</div>


<div class="event-row">

<span>
🎟️ Total People
</span>

<strong>
${event.total}
</strong>

</div>


<div class="event-row">

<span>
✅ Checked In
</span>

<strong>
${event.checked}
</strong>

</div>


<div class="event-row">

<span>
⏳ Not Checked In
</span>

<strong>
${event.notChecked}
</strong>

</div>


<div class="event-names">

<div class="event-names-title">

👥 People who booked this event:

</div>

<ul>

${namesHTML}

</ul>

</div>

`;


eventStats.appendChild(card);

});

}


/* DISPLAY BOOKINGS */

function displayBookings(bookings){

const bookingsDiv =
document.getElementById("bookings");


bookingsDiv.innerHTML="";


if(bookings.length===0){

bookingsDiv.innerHTML=
"<p>No bookings found.</p>";

return;

}


bookings.forEach(
(data)=>{


/*
IMPORTANT:
Booking system ɗinka yana amfani da ticketID.
Mun kuma bar ticketNumber/ticket/id
domin Check-in ya yi aiki.
*/

const ticketNumber =
data.ticketID ||
data.ticketNumber ||
data.ticket ||
data.id;


const checked =
data.checkedIn === true;


const div =
document.createElement("div");


div.className="booking";


div.innerHTML=`

<h3>

🎫 Ticket:
${escapeHTML(ticketNumber)}

</h3>


<p>

<strong>👤 Name:</strong>

${escapeHTML(
data.name || "N/A"
)}

</p>


<p>

<strong>📧 Email:</strong>

${escapeHTML(
data.email || "N/A"
)}

</p>


<p>

<strong>📱 Phone:</strong>

${escapeHTML(
data.phone || "N/A"
)}

</p>


<p>

<strong>🎟️ Event:</strong>

${escapeHTML(
data.event || "N/A"
)}

</p>


<p>

<strong>📅 Date:</strong>

${escapeHTML(
data.date || "N/A"
)}

</p>


<p class="status">

Status:

${
checked

?

'<span class="checked">✅ Checked In</span>'

:

'<span class="notchecked">⏳ Not Checked In</span>'

}

</p>


<button
class="red"
onclick="deleteBooking('${data.id}')">

🗑️ Delete Booking

</button>

`;


bookingsDiv.appendChild(div);

});

}


/* SEARCH */

window.searchBookings = function(){

const search =
document.getElementById(
"searchInput"
)
.value
.toLowerCase()
.trim();


if(!search){

displayBookings(
allBookings
);

return;

}


const results =
allBookings.filter(
(data)=>{

const name =
String(
data.name || ""
).toLowerCase();


const email =
String(
data.email || ""
).toLowerCase();


const event =
String(
data.event || ""
).toLowerCase();


const ticket =
String(

data.ticketID ||

data.ticketNumber ||

data.ticket ||

data.id ||

""

).toLowerCase();


return(

name.includes(search) ||

email.includes(search) ||

event.includes(search) ||

ticket.includes(search)

);

});


displayBookings(results);

};


/* CHECK IN */

window.checkInTicket = async function(){

const ticket =
document.getElementById(
"ticketNumber"
)
.value
.trim();


const message =
document.getElementById(
"checkinMessage"
);


const result =
document.getElementById(
"checkinResult"
);


result.innerHTML="";


if(!ticket){

message.style.color="red";

message.textContent=
"❌ Please enter a Ticket Number.";

return;

}


message.style.color="black";

message.textContent=
"⏳ Checking ticket...";


try{


/*
FIRST SEARCH INSIDE LOADED BOOKINGS
*/

let found =
allBookings.find(
(b)=>{

const number =
String(

b.ticketID ||

b.ticketNumber ||

b.ticket ||

b.id ||

""

);

return number === ticket;

});



/*
IF NOT FOUND, SEARCH FIREBASE
*/

if(!found){

let snapshot =
await getDocs(
collection(db,"bookings")
);


snapshot.forEach(
(d)=>{

const data =
d.data();


const number =
String(

data.ticketID ||

data.ticketNumber ||

data.ticket ||

d.id ||

""

);


if(number === ticket){

found={

id:d.id,

...data

};

}

});

}


/*
TICKET NOT FOUND
*/

if(!found){

message.style.color="red";

message.textContent=
"❌ Ticket not found.";

return;

}


/*
SHOW TICKET INFORMATION
*/

result.innerHTML=`

<div class="booking">

<h3>
🎫 Ticket Found
</h3>

<p>

<strong>👤 Name:</strong>

${escapeHTML(
found.name || "N/A"
)}

</p>

<p>

<strong>📧 Email:</strong>

${escapeHTML(
found.email || "N/A"
)}

</p>

<p>

<strong>📱 Phone:</strong>

${escapeHTML(
found.phone || "N/A"
)}

</p>

<p>

<strong>🎟️ Event:</strong>

${escapeHTML(
found.event || "N/A"
)}

</p>

<p>

<strong>🎫 Ticket Number:</strong>

${escapeHTML(

found.ticketID ||

found.ticketNumber ||

found.ticket ||

found.id

)}

</p>

<p>

<strong>Status:</strong>

${
found.checkedIn === true

?

'<span class="checked">✅ Already Checked In</span>'

:

'<span class="notchecked">⏳ Not Checked In</span>'

}

</p>

</div>

`;


/*
ALREADY CHECKED IN
*/

if(found.checkedIn === true){

message.style.color="orange";

message.textContent=
"⚠️ This ticket has already been checked in.";

return;

}


/*
SAVE CHECK-IN
*/

await updateDoc(

doc(
db,
"bookings",
found.id
),

{

checkedIn:true,

checkedInAt:
new Date()

}

);


message.style.color="green";

message.textContent=
"✅ Check-in successful!";


document.getElementById(
"ticketNumber"
).value="";


await loadBookings();


}catch(error){

console.error(error);

message.style.color="red";

message.textContent=
"❌ Check-in failed: " +
error.message;

}

};


/* DELETE BOOKING */

window.deleteBooking =
async function(id){

const confirmDelete =
confirm(
"Are you sure you want to delete this booking?"
);


if(!confirmDelete){

return;

}


try{

await deleteDoc(

doc(
db,
"bookings",
id
)

);


alert(
"✅ Booking deleted successfully."
);


loadBookings();


}catch(error){

console.error(error);

alert(
"❌ Unable to delete booking."
);

}

};


/* EXPORT CSV */

window.exportCSV = function(){

if(allBookings.length===0){

alert(
"There are no bookings to export."
);

return;

}


let csv =
"Name,Email,Phone,Event,Ticket Number,Date,Status\n";


allBookings.forEach(
(data)=>{

const name =
csvValue(
data.name || ""
);


const email =
csvValue(
data.email || ""
);


const phone =
csvValue(
data.phone || ""
);


const event =
csvValue(
data.event || ""
);


const ticket =
csvValue(

data.ticketID ||

data.ticketNumber ||

data.ticket ||

data.id ||

""

);


const date =
csvValue(
data.date || ""
);


const status =
data.checkedIn === true

?

"Checked In"

:

"Not Checked In";


csv +=
`${name},${email},${phone},${event},${ticket},${date},${csvValue(status)}\n`;

});


const blob =
new Blob(

[csv],

{
type:
"text/csv;charset=utf-8;"
}

);


const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");


link.href=url;

link.download=
"event-bookings.csv";


document.body.appendChild(link);

link.click();

document.body.removeChild(link);

URL.revokeObjectURL(url);

};


/* CSV HELPER */

function csvValue(value){

return `"${String(value)
.replace(/"/g,'""')}"`;

}


/* HTML SECURITY HELPER */

function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

</script></body>
</html>
